[project]
name = "pulsenotify"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ajuzxx", email = "ajasmathew2003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[project.scripts]
pulsenotify = "pulsenotify:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
